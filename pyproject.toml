[project]
name = "sast-model-eval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=3.35.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "tree-sitter>=0.26.0",
    "tree-sitter-java>=0.23.5",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "semgrep==1.181.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
